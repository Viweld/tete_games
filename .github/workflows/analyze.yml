name: Analyze

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Flutter version from FVM
        run: |
          fvm install
          fvm flutter --version

      - name: Pub get
        run: fvm flutter pub get

      - name: Workspace dependency graph
        run: fvm dart run tool/check_workspace_graph.dart

      - name: Analyze workspace packages
        run: |
          fvm dart analyze \
            lib \
            core/lib \
            core_ui/lib \
            infrastructure/lib \
            navigation_api/lib \
            navigation/lib \
            platform/peer/lib \
            features/shell/lib \
            tool

      - name: Test
        run: fvm flutter test platform/peer/test
