name: app
description: tete games — offline BLE multiplayer games (Flutterozavr workspace)
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.2 <4.0.0'

workspace:
  - core
  - core_ui
  - data
  - domain
  - infrastructure
  - navigation_api
  - navigation
  # fz:workspace-features
  - features/shell

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ./core
  core_ui:
    path: ./core_ui
  data:
    path: ./data
  domain:
    path: ./domain
  infrastructure:
    path: ./infrastructure
  navigation:
    path: ./navigation
  # fz:feature-deps
  shell:
    path: ./features/shell

  get_it: ^9.2.1
  injectable: ^3.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon_1024.png
  remove_alpha_ios: true

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/app_logo.png
  image_dark: assets/app_logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/app_logo.png
    image_dark: assets/app_logo.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app_logo.png
    - assets/app_icon.png
    - .env
