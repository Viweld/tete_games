name: infrastructure
publish_to: none
description: Frameworks and drivers — local storage, Firebase, BLE transport.

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  domain:
    path: ../domain
  peer:
    path: ../platform/peer

  ble_peer_session: ^0.4.3
  device_info_plus: ^13.1.0
  flutter_blue_plus: ^2.3.8
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.3
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.3
  injectable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  injectable_generator: ^3.0.2
