name: core_ui
publish_to: none
description: Project core UI module

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ../core
  domain:
    path: ../domain
  navigation:
    path: ../navigation

  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  pinput: ^6.0.2
  mask_text_input_formatter: ^2.9.0
  flutter_bloc: ^9.1.1
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  shimmer: ^3.0.0
  table_calendar: ^3.2.0
  country_flags: ^4.1.2
  sealed_countries: ^3.1.0
  money2: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - resources/icons/
    - resources/icons/profile/
    - resources/icons/nav_bar/
    - resources/icons/app_bar/
    - resources/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: resources/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: resources/fonts/Manrope-Light.ttf
          weight: 300
        - asset: resources/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: resources/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: resources/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: resources/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: resources/fonts/Manrope-ExtraBold.ttf
          weight: 800
