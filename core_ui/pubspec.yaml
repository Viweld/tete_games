name: core_ui
publish_to: none
description: Project core UI module

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ../core

  flutter_svg: ^2.2.3
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  lottie: ^3.4.0
  injectable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - resources/icons/
    - resources/images/
    - resources/animations/

  fonts:
    - family: Manrope
      fonts:
        - asset: resources/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: resources/fonts/Manrope-Light.ttf
          weight: 300
        - asset: resources/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: resources/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: resources/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: resources/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: resources/fonts/Manrope-ExtraBold.ttf
          weight: 800
